name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      # preview of the `timeline` branch at /preview/ (best effort: never blocks the main deploy)
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: timeline
          path: _preview
      - name: Build timeline preview into dist/preview
        continue-on-error: true
        run: |
          cd _preview && bun install --frozen-lockfile && bun run build
          mkdir -p ../dist/preview && cp -r dist/. ../dist/preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
