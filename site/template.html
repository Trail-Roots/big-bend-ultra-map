<base href="{{base}}">

</head>

  {{layers}}{{register}}<span class="printctl"><a class="pdf" href="big-bend-ultra-2027-map.pdf" download aria-label="Download PDF">{{ic:filedown}}<span class="pdflab">Download PDF</span></a></span>{{draftnote}}</nav>
